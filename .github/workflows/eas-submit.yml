name: EAS Submit (iOS to TestFlight)

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "EAS build ID to submit (leave empty to submit the latest finished production build)"
        required: false
        default: ""

jobs:
  submit:
    name: Submit iOS build to App Store Connect
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Submit to App Store Connect / TestFlight
        run: |
          if [ -n "${{ github.event.inputs.build_id }}" ]; then
            eas submit --platform ios --id "${{ github.event.inputs.build_id }}" --non-interactive
          else
            eas submit --platform ios --latest --non-interactive
          fi
        env:
          EXPO_APPLE_ID: ${{ secrets.EXPO_APPLE_ID }}
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}
